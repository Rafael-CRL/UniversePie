<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Side of the Moon — Alpha Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-surface: #21262d;
            --bg-surface-hover: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --text-muted: #484f58;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --success: #3fb950;
            --success-bg: rgba(63, 185, 80, 0.12);
            --error: #f85149;
            --error-bg: rgba(248, 81, 73, 0.12);
            --border: #30363d;
            --radius: 8px;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 48px;
        }
        .header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Screens */
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Start Screen */
        .start-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 80px;
        }
        .start-controls label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .start-controls select {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 14px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
        }
        .start-controls select:focus { border-color: var(--accent); }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover { background: var(--accent-hover); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: var(--bg-surface); color: var(--text-muted); cursor: not-allowed; transform: none; }
        .btn-secondary {
            background: var(--bg-surface);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: var(--bg-surface-hover); }

        /* Loading */
        #loading-screen { text-align: center; padding-top: 80px; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: var(--text-secondary); font-size: 0.95rem; }

        /* Progress bar */
        .progress-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }
        .progress-track {
            flex: 1;
            height: 4px;
            background: var(--bg-surface);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.4s ease;
        }
        .progress-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            min-width: 36px;
            text-align: right;
        }

        /* Quiz */
        .quiz-tags {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .concept-tag {
            display: inline-block;
            background: rgba(124, 58, 237, 0.15);
            color: var(--accent);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .type-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .type-tag.discrimination { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .type-tag.production { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .type-tag.interference { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .type-tag.polysemy { background: rgba(168, 85, 247, 0.15); color: #a855f7; }
        .type-tag.contextual { background: rgba(236, 72, 153, 0.15); color: #ec4899; }
        .question {
            font-size: 1.15rem;
            font-weight: 500;
            line-height: 1.5;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        /* Options */
        .option {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            text-align: left;
        }
        .option:hover:not(.disabled) {
            background: var(--bg-surface-hover);
            border-color: var(--text-muted);
        }
        .option .key-hint {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: var(--bg-surface);
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .option.correct {
            background: var(--success-bg);
            border-color: var(--success);
        }
        .option.correct .key-hint { background: var(--success); color: #fff; }
        .option.incorrect {
            background: var(--error-bg);
            border-color: var(--error);
        }
        .option.incorrect .key-hint { background: var(--error); color: #fff; }
        .option.disabled { pointer-events: none; cursor: default; }
        .option.disabled:not(.correct):not(.incorrect) { opacity: 0.4; }

        /* Explanation */
        .explanation {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .explanation.visible { display: block; animation: fadeIn 0.3s ease; }

        /* Original card (collapsible) */
        .original-card {
            margin-top: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .original-card summary {
            padding: 10px 16px;
            background: var(--bg-secondary);
            color: var(--text-muted);
            font-size: 0.8rem;
            cursor: pointer;
            user-select: none;
        }
        .original-card summary:hover { color: var(--text-secondary); }
        .original-card .card-content {
            padding: 12px 16px;
            background: var(--bg-primary);
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .original-card .card-content strong {
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Navigation */
        .quiz-nav {
            display: none;
            margin-top: 24px;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
        }
        .quiz-nav.visible { display: flex; animation: fadeIn 0.2s ease; }
        .nav-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Summary */
        .summary-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .score-display {
            font-size: 3rem;
            font-weight: 700;
            margin: 16px 0 8px;
        }
        .score-display .correct-count { color: var(--success); }
        .score-display .separator { color: var(--text-muted); }
        .score-display .total-count { color: var(--text-secondary); }
        .score-label {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .summary-section {
            margin-bottom: 24px;
        }
        .summary-section h3 {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }
        .summary-item {
            padding: 14px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 8px;
        }
        .summary-item .item-concept {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }
        .summary-item .item-explanation {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .summary-item.missed { border-left: 3px solid var(--error); }
        .summary-item.hit { border-left: 3px solid var(--success); }

        .summary-actions {
            text-align: center;
            margin-top: 36px;
        }

        /* Error */
        .error-box {
            display: none;
            padding: 16px;
            background: var(--error-bg);
            border: 1px solid var(--error);
            border-radius: var(--radius);
            color: var(--error);
            font-size: 0.9rem;
            margin-top: 20px;
        }
        .error-box.visible { display: block; }

        /* Cloze */
        .cloze-sentence {
            font-size: 1.2rem;
            font-weight: 500;
            line-height: 1.7;
            margin-bottom: 24px;
            color: var(--text-primary);
        }
        .cloze-blank {
            display: inline-block;
            min-width: 120px;
            border-bottom: 2px dashed var(--accent);
            color: var(--accent);
            font-weight: 700;
            padding: 0 4px;
        }
        .cloze-input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .cloze-input {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .cloze-input:focus { border-color: var(--accent); }
        .cloze-input:disabled { opacity: 0.5; }
        .cloze-hint {
            margin-bottom: 16px;
        }
        .cloze-hint summary {
            color: var(--text-muted);
            font-size: 0.8rem;
            cursor: pointer;
            user-select: none;
        }
        .cloze-hint summary:hover { color: var(--text-secondary); }
        .cloze-hint .hint-text {
            padding: 8px 0 0;
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-style: italic;
        }
        .cloze-feedback {
            display: none;
            padding: 14px 16px;
            border-radius: var(--radius);
            font-size: 0.9rem;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .cloze-feedback.visible { display: block; animation: fadeIn 0.3s ease; }
        .cloze-feedback.correct {
            background: var(--success-bg);
            border: 1px solid var(--success);
            color: var(--success);
        }
        .cloze-feedback.alternative {
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid #3b82f6;
            color: #93c5fd;
        }
        .cloze-feedback.incorrect {
            background: var(--error-bg);
            border: 1px solid var(--error);
            color: var(--error);
        }
        .commonality-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .commonality-tag.common { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .commonality-tag.moderate { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .commonality-tag.niche { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .context-note {
            margin-top: 8px;
            padding: 10px 14px;
            background: var(--bg-secondary);
            border-left: 3px solid var(--text-muted);
            border-radius: 0 var(--radius) var(--radius) 0;
            color: var(--text-secondary);
            font-size: 0.8rem;
            line-height: 1.5;
        }
        .mode-selector {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            justify-content: center;
        }
        .mode-btn {
            padding: 10px 28px;
            background: var(--bg-surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-btn:first-child { border-radius: var(--radius) 0 0 var(--radius); }
        .mode-btn:last-child { border-radius: 0 var(--radius) var(--radius) 0; border-left: none; }
        .mode-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .mode-btn:hover:not(.active) {
            background: var(--bg-surface-hover);
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Dark Side of the Moon</h1>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="quiz">Quiz</button>
                <button class="mode-btn" data-mode="cloze">Cloze</button>
            </div>
            <div class="start-controls">
                <label for="exercise-count">Exercícios:</label>
                <select id="exercise-count">
                    <option value="3">3</option>
                    <option value="5" selected>5</option>
                    <option value="7">7</option>
                    <option value="10">10</option>
                </select>
                <button class="btn" id="start-btn">Iniciar Sessão</button>
            </div>
        </div>

        <!-- Loading Screen -->
        <div id="loading-screen" class="screen">
            <div class="spinner"></div>
            <div class="loading-text">Gerando quizzes...</div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen">
            <div class="progress-bar">
                <div class="progress-track">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span class="progress-label" id="progress-label"></span>
            </div>

            <div class="quiz-tags">
                <div class="concept-tag" id="concept"></div>
                <div class="type-tag" id="quiz-type"></div>
            </div>
            <div class="question" id="question"></div>
            <div id="options"></div>

            <div class="explanation" id="explanation"></div>

            <details class="original-card" id="original-card" style="display: none;">
                <summary>Ver card original do Anki</summary>
                <div class="card-content" id="card-content"></div>
            </details>

            <div class="quiz-nav" id="quiz-nav">
                <span class="nav-hint">Enter ↵</span>
                <button class="btn" id="next-btn">Próximo</button>
            </div>
        </div>

        <!-- Cloze Screen -->
        <div id="cloze-screen" class="screen">
            <div class="progress-bar">
                <div class="progress-track">
                    <div class="progress-fill" id="cloze-progress-fill"></div>
                </div>
                <span class="progress-label" id="cloze-progress-label"></span>
            </div>

            <div class="quiz-tags">
                <div class="concept-tag" id="cloze-concept"></div>
                <div class="commonality-tag" id="cloze-commonality"></div>
            </div>
            <div class="cloze-sentence" id="cloze-sentence"></div>

            <div class="cloze-input-area">
                <input type="text" class="cloze-input" id="cloze-input" placeholder="Type your answer..." autocomplete="off" spellcheck="false">
                <button class="btn" id="cloze-submit-btn">Submit</button>
            </div>

            <details class="cloze-hint" id="cloze-hint-details">
                <summary>Show hint</summary>
                <div class="hint-text" id="cloze-hint-text"></div>
            </details>

            <div class="cloze-feedback" id="cloze-feedback"></div>

            <div class="explanation" id="cloze-explanation"></div>

            <div id="cloze-context-note" class="context-note" style="display: none;"></div>

            <details class="original-card" id="cloze-original-card" style="display: none;">
                <summary>Ver cards-fonte do Anki</summary>
                <div class="card-content" id="cloze-card-content"></div>
            </details>

            <div class="quiz-nav" id="cloze-nav">
                <span class="nav-hint">Enter ↵</span>
                <button class="btn" id="cloze-next-btn">Próximo</button>
            </div>
        </div>

        <!-- Summary Screen -->
        <div id="summary-screen" class="screen">
            <div class="summary-header">
                <div class="score-label">Resultado da sessão</div>
                <div class="score-display">
                    <span class="correct-count" id="score-correct"></span>
                    <span class="separator">/</span>
                    <span class="total-count" id="score-total"></span>
                </div>
            </div>
            <div id="summary-missed" class="summary-section"></div>
            <div id="summary-hit" class="summary-section"></div>
            <div class="summary-actions">
                <button class="btn" id="restart-btn">Nova Sessão</button>
                <span class="nav-hint" style="display: block; margin-top: 8px;">N</span>
            </div>
        </div>

        <!-- Error -->
        <div class="error-box" id="error-box"></div>
    </div>

    <script>
        // ===== Shared State =====
        let currentMode = 'quiz'; // 'quiz' or 'cloze'
        let exercises = [];
        let currentIndex = 0;
        let answered = false;
        let results = [];

        // ===== Shared Elements =====
        const screens = {
            start: document.getElementById('start-screen'),
            loading: document.getElementById('loading-screen'),
            quiz: document.getElementById('quiz-screen'),
            cloze: document.getElementById('cloze-screen'),
            summary: document.getElementById('summary-screen'),
        };
        const exerciseCount = document.getElementById('exercise-count');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const errorBox = document.getElementById('error-box');
        const loadingText = document.querySelector('.loading-text');

        // Quiz elements
        const quizProgressFill = document.getElementById('progress-fill');
        const quizProgressLabel = document.getElementById('progress-label');
        const conceptEl = document.getElementById('concept');
        const quizTypeEl = document.getElementById('quiz-type');
        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const explanationEl = document.getElementById('explanation');
        const originalCard = document.getElementById('original-card');
        const cardContent = document.getElementById('card-content');
        const quizNav = document.getElementById('quiz-nav');
        const nextBtn = document.getElementById('next-btn');

        // Cloze elements
        const clozeProgressFill = document.getElementById('cloze-progress-fill');
        const clozeProgressLabel = document.getElementById('cloze-progress-label');
        const clozeConcept = document.getElementById('cloze-concept');
        const clozeCommonality = document.getElementById('cloze-commonality');
        const clozeSentence = document.getElementById('cloze-sentence');
        const clozeInput = document.getElementById('cloze-input');
        const clozeSubmitBtn = document.getElementById('cloze-submit-btn');
        const clozeHintDetails = document.getElementById('cloze-hint-details');
        const clozeHintText = document.getElementById('cloze-hint-text');
        const clozeFeedback = document.getElementById('cloze-feedback');
        const clozeExplanation = document.getElementById('cloze-explanation');
        const clozeContextNote = document.getElementById('cloze-context-note');
        const clozeOriginalCard = document.getElementById('cloze-original-card');
        const clozeCardContent = document.getElementById('cloze-card-content');
        const clozeNav = document.getElementById('cloze-nav');
        const clozeNextBtn = document.getElementById('cloze-next-btn');

        // ===== Mode Selector =====
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
            });
        });

        // ===== Screen Management =====
        function showScreen(name) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[name].classList.add('active');
            errorBox.classList.remove('visible');
        }

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.classList.add('visible');
        }

        // ===== Start Session =====
        startBtn.addEventListener('click', startSession);

        async function startSession() {
            const n = parseInt(exerciseCount.value);
            loadingText.textContent = currentMode === 'quiz' ? 'Gerando quizzes...' : 'Gerando exercícios cloze...';
            showScreen('loading');

            const endpoint = currentMode === 'quiz' ? '/api/quiz-session' : '/api/cloze-session';

            try {
                const res = await fetch(`${endpoint}?n=${n}`);
                if (!res.ok) {
                    const err = await res.json().catch(() => ({ detail: res.statusText }));
                    throw new Error(err.detail || 'Erro ao gerar sessão');
                }
                const data = await res.json();
                exercises = data.quizzes || data.exercises;
                currentIndex = 0;
                results = [];
                showScreen(currentMode);
                if (currentMode === 'quiz') renderQuiz();
                else renderCloze();
            } catch (err) {
                showScreen('start');
                showError(err.message);
            }
        }

        // ===== QUIZ MODE =====
        function renderQuiz() {
            const quiz = exercises[currentIndex];
            answered = false;

            const pct = ((currentIndex) / exercises.length) * 100;
            quizProgressFill.style.width = pct + '%';
            quizProgressLabel.textContent = `${currentIndex + 1}/${exercises.length}`;

            conceptEl.textContent = quiz.concept;
            quizTypeEl.textContent = quiz.quiz_type;
            quizTypeEl.className = 'type-tag ' + quiz.quiz_type;
            questionEl.textContent = quiz.question;

            optionsEl.innerHTML = '';
            quiz.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.innerHTML = `<span class="key-hint">${idx + 1}</span><span>${opt}</span>`;
                btn.addEventListener('click', () => selectOption(idx));
                optionsEl.appendChild(btn);
            });

            explanationEl.classList.remove('visible');
            originalCard.style.display = 'none';
            originalCard.removeAttribute('open');
            quizNav.classList.remove('visible');

            nextBtn.textContent = currentIndex < exercises.length - 1 ? 'Próximo' : 'Ver Resultado';
        }

        function selectOption(selectedIdx) {
            if (answered) return;
            answered = true;

            const quiz = exercises[currentIndex];
            const correct = selectedIdx === quiz.answer_index;
            const options = optionsEl.querySelectorAll('.option');

            results.push({
                correct,
                concept: quiz.concept,
                explanation: quiz.explanation,
                question: quiz.question,
            });

            options.forEach((opt, idx) => {
                opt.classList.add('disabled');
                if (idx === quiz.answer_index) opt.classList.add('correct');
                if (idx === selectedIdx && !correct) opt.classList.add('incorrect');
            });

            explanationEl.textContent = quiz.explanation;
            explanationEl.classList.add('visible');

            const sourceCards = quiz.source_cards || [];
            let cardsHtml = '';
            sourceCards.forEach((sc, i) => {
                if (sourceCards.length > 1) cardsHtml += `<div style="color: var(--text-muted); font-size: 0.75rem; margin-bottom: 4px;">Card ${i + 1}</div>`;
                cardsHtml += `<strong>Front:</strong> ${sc.front}<br><strong>Back:</strong> ${sc.back}`;
                if (i < sourceCards.length - 1) cardsHtml += '<hr style="border: none; border-top: 1px solid var(--border); margin: 10px 0;">';
            });
            cardContent.innerHTML = cardsHtml;
            originalCard.style.display = 'block';

            quizNav.classList.add('visible');

            const pct = ((currentIndex + 1) / exercises.length) * 100;
            quizProgressFill.style.width = pct + '%';
        }

        nextBtn.addEventListener('click', advanceExercise);

        // ===== CLOZE MODE =====
        function normalize(str) {
            return str.toLowerCase().trim().replace(/\s+/g, ' ');
        }

        function renderCloze() {
            const ex = exercises[currentIndex];
            answered = false;

            const pct = ((currentIndex) / exercises.length) * 100;
            clozeProgressFill.style.width = pct + '%';
            clozeProgressLabel.textContent = `${currentIndex + 1}/${exercises.length}`;

            clozeConcept.textContent = ex.concept;
            clozeCommonality.textContent = ex.commonality;
            clozeCommonality.className = 'commonality-tag ' + ex.commonality;

            // Render sentence with styled blank
            const sentenceHtml = ex.sentence.replace('_____', '<span class="cloze-blank">?????</span>');
            clozeSentence.innerHTML = sentenceHtml;

            // Reset input
            clozeInput.value = '';
            clozeInput.disabled = false;
            clozeSubmitBtn.disabled = false;
            clozeInput.focus();

            // Hint
            clozeHintDetails.removeAttribute('open');
            clozeHintText.textContent = ex.hint;

            // Hide post-answer elements
            clozeFeedback.classList.remove('visible', 'correct', 'alternative', 'incorrect');
            clozeExplanation.classList.remove('visible');
            clozeContextNote.style.display = 'none';
            clozeOriginalCard.style.display = 'none';
            clozeOriginalCard.removeAttribute('open');
            clozeNav.classList.remove('visible');

            clozeNextBtn.textContent = currentIndex < exercises.length - 1 ? 'Próximo' : 'Ver Resultado';
        }

        function submitCloze() {
            if (answered) return;
            const userAnswer = clozeInput.value.trim();
            if (!userAnswer) return;
            answered = true;

            const ex = exercises[currentIndex];
            const normalizedAnswer = normalize(userAnswer);
            const normalizedTarget = normalize(ex.target_expression);
            const normalizedAlts = (ex.acceptable_alternatives || []).map(normalize);

            let status; // 'correct', 'alternative', 'incorrect'
            let feedbackHtml;

            if (normalizedAnswer === normalizedTarget) {
                status = 'correct';
                feedbackHtml = `<strong>Correto!</strong> A expressão-alvo é: <strong>${ex.target_expression}</strong>`;
            } else if (normalizedAlts.includes(normalizedAnswer)) {
                status = 'alternative';
                feedbackHtml = `<strong>Alternativa válida.</strong> Sua resposta "${userAnswer}" funciona neste contexto.<br>A expressão-alvo era: <strong>${ex.target_expression}</strong>`;
            } else {
                status = 'incorrect';
                feedbackHtml = `<strong>Incorreto.</strong> Sua resposta: "${userAnswer}"<br>Expressão-alvo: <strong>${ex.target_expression}</strong>`;
                if (ex.acceptable_alternatives && ex.acceptable_alternatives.length > 0) {
                    feedbackHtml += `<br>Alternativas aceitas: ${ex.acceptable_alternatives.join(', ')}`;
                }
            }

            results.push({
                correct: status === 'correct' || status === 'alternative',
                concept: ex.concept,
                explanation: ex.explanation,
                question: ex.sentence,
                userAnswer: userAnswer,
                targetAnswer: ex.target_expression,
                status: status,
            });

            // Show feedback
            clozeFeedback.innerHTML = feedbackHtml;
            clozeFeedback.className = 'cloze-feedback visible ' + status;

            // Update sentence blank with answer
            const blankEl = clozeSentence.querySelector('.cloze-blank');
            if (blankEl) {
                blankEl.textContent = ex.target_expression;
                blankEl.style.borderBottom = 'none';
            }

            // Show explanation
            clozeExplanation.textContent = ex.explanation;
            clozeExplanation.classList.add('visible');

            // Show context note if present
            if (ex.context_note) {
                clozeContextNote.textContent = ex.context_note;
                clozeContextNote.style.display = 'block';
            }

            // Show source cards
            const sourceCards = ex.source_cards || [];
            let cardsHtml = '';
            sourceCards.forEach((sc, i) => {
                if (sourceCards.length > 1) cardsHtml += `<div style="color: var(--text-muted); font-size: 0.75rem; margin-bottom: 4px;">Card ${i + 1}</div>`;
                cardsHtml += `<strong>Front:</strong> ${sc.front}<br><strong>Back:</strong> ${sc.back}`;
                if (i < sourceCards.length - 1) cardsHtml += '<hr style="border: none; border-top: 1px solid var(--border); margin: 10px 0;">';
            });
            clozeCardContent.innerHTML = cardsHtml;
            clozeOriginalCard.style.display = 'block';

            // Disable input
            clozeInput.disabled = true;
            clozeSubmitBtn.disabled = true;

            // Show nav
            clozeNav.classList.add('visible');

            const pct = ((currentIndex + 1) / exercises.length) * 100;
            clozeProgressFill.style.width = pct + '%';
        }

        clozeSubmitBtn.addEventListener('click', submitCloze);
        clozeNextBtn.addEventListener('click', advanceExercise);

        // ===== SHARED NAVIGATION =====
        function advanceExercise() {
            if (!answered) return;
            currentIndex++;
            if (currentIndex < exercises.length) {
                const screenName = currentMode;
                screens[screenName].classList.remove('active');
                void screens[screenName].offsetWidth;
                screens[screenName].classList.add('active');
                if (currentMode === 'quiz') renderQuiz();
                else renderCloze();
            } else {
                showSummary();
            }
        }

        // ===== SUMMARY =====
        function showSummary() {
            showScreen('summary');

            const correctCount = results.filter(r => r.correct).length;
            document.getElementById('score-correct').textContent = correctCount;
            document.getElementById('score-total').textContent = results.length;

            const missedSection = document.getElementById('summary-missed');
            const hitSection = document.getElementById('summary-hit');
            missedSection.innerHTML = '';
            hitSection.innerHTML = '';

            const missed = results.filter(r => !r.correct);
            const hits = results.filter(r => r.correct);

            if (missed.length > 0) {
                missedSection.innerHTML = '<h3>Conceitos errados</h3>';
                missed.forEach(r => {
                    let detail = r.explanation;
                    if (r.userAnswer) detail = `Sua resposta: "${r.userAnswer}" — Alvo: "${r.targetAnswer}"<br>${detail}`;
                    missedSection.innerHTML += `
                        <div class="summary-item missed">
                            <div class="item-concept">${r.concept}</div>
                            <div class="item-explanation">${detail}</div>
                        </div>`;
                });
            }

            if (hits.length > 0) {
                const details = document.createElement('details');
                details.innerHTML = `<summary style="color: var(--text-muted); font-size: 0.85rem; cursor: pointer; margin-bottom: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Conceitos acertados (${hits.length})</summary>`;
                hits.forEach(r => {
                    details.innerHTML += `
                        <div class="summary-item hit">
                            <div class="item-concept">${r.concept}</div>
                        </div>`;
                });
                hitSection.appendChild(details);
            }
        }

        // ===== RESTART =====
        restartBtn.addEventListener('click', () => showScreen('start'));

        // ===== KEYBOARD SHORTCUTS =====
        document.addEventListener('keydown', (e) => {
            const quizActive = screens.quiz.classList.contains('active');
            const clozeActive = screens.cloze.classList.contains('active');
            const summaryActive = screens.summary.classList.contains('active');
            const startActive = screens.start.classList.contains('active');

            // Quiz shortcuts
            if (quizActive && !answered) {
                if (e.key >= '1' && e.key <= '4') {
                    e.preventDefault();
                    const idx = parseInt(e.key) - 1;
                    if (idx < exercises[currentIndex].options.length) {
                        selectOption(idx);
                    }
                }
            }

            if (quizActive && answered) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    advanceExercise();
                }
            }

            // Cloze shortcuts
            if (clozeActive && !answered) {
                if (e.key === 'Enter' && document.activeElement === clozeInput) {
                    e.preventDefault();
                    submitCloze();
                }
            }

            if (clozeActive && answered) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    advanceExercise();
                }
            }

            // Summary / Start shortcuts
            if (summaryActive) {
                if (e.key === 'n' || e.key === 'N') {
                    e.preventDefault();
                    showScreen('start');
                }
            }

            if (startActive) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    startSession();
                }
            }
        });
    </script>
</body>
</html>
